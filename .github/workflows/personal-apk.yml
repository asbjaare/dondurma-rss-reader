name: Personal Android APK

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: personal-apk
  cancel-in-progress: false

env:
  DONDURMA_APPLICATION_ID: io.github.asbjaare.dondurma

jobs:
  build:
    if: github.repository == 'asbjaare/dondurma-rss-reader' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DONDURMA_UNSIGNED_BUILD: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          # This composite action references mutable cache actions internally.
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build unsigned APK without signing credentials
        run: |
          set -euo pipefail
          build_number=$((1000000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --no-tree-shake-icons --build-number="$build_number"
          cp build/app/outputs/flutter-apk/app-release.apk dondurma-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-personal-apk
          path: dondurma-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    # Deliberately no source checkout, Flutter, Gradle, tests, or build cache.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-personal-apk
          path: incoming
      - name: Locate signing tools before exposing secrets
        run: |
          set -euo pipefail
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          [[ -x "$tools" ]]
          echo "APK_BUILD_TOOLS=$(dirname "$tools")" >> "$GITHUB_ENV"
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PERSONAL_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PERSONAL_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing signing secret: $name. Run scripts/publish-apk.sh locally."
              exit 1
            fi
          done
          umask 077
          key="$RUNNER_TEMP/personal.jks"
          trap 'rm -f -- "$key" "$RUNNER_TEMP/personal.der"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          # Align before signing; never execute anything from the input artifact.
          "$APK_BUILD_TOOLS/zipalign" -P 16 -f 4 incoming/dondurma-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$APK_BUILD_TOOLS/apksigner" sign --ks "$key" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out dondurma-personal.apk "$RUNNER_TEMP/aligned.apk"
          keytool -exportcert -keystore "$key" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/personal.der"
          expected=$(openssl x509 -inform DER -in "$RUNNER_TEMP/personal.der" \
            -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          "$APK_BUILD_TOOLS/apksigner" verify --print-certs dondurma-personal.apk > "$RUNNER_TEMP/apk-signature.txt"
          grep -qi "certificate SHA-256 digest: $expected" "$RUNNER_TEMP/apk-signature.txt"
          "$APK_BUILD_TOOLS/zipalign" -c -P 16 4 dondurma-personal.apk
          shasum -a 256 dondurma-personal.apk > dondurma-personal.apk.sha256
          echo "APK signing certificate: $expected" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing files after cancellation or failure
        if: always()
        run: rm -f -- "$RUNNER_TEMP/personal.jks" "$RUNNER_TEMP/personal.der"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: personal-apk
          path: |
            dondurma-personal.apk
            dondurma-personal.apk.sha256
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Fresh runner: only download the signed files and publish them.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: personal-apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="personal-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dondurma-personal.apk dondurma-personal.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dondurma personal APK #${GITHUB_RUN_NUMBER}" \
            --notes "Personal Android build from ${GITHUB_SHA}. Download dondurma-personal.apk on your phone to install. Package: ${DONDURMA_APPLICATION_ID}."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
