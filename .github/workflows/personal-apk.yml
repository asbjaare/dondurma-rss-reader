name: Personal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-apk
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'
  DONDURMA_APPLICATION_ID: io.github.asbjaare.dondurma

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.PERSONAL_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.PERSONAL_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore personal signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing signing secret: $name. Run scripts/publish-apk.sh locally."
              exit 1
            fi
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/personal.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build signed APK
        run: |
          # Keep CI versions above local pubspec build numbers.
          build_number=$((1000000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --no-tree-shake-icons --build-number="$build_number"
          cp build/app/outputs/flutter-apk/app-release.apk dondurma-personal.apk
          shasum -a 256 dondurma-personal.apk > dondurma-personal.apk.sha256
      - name: Verify APK signature
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/personal.der"
          expected=$(openssl x509 -inform DER -in "$RUNNER_TEMP/personal.der" \
            -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          "$signer" verify --print-certs dondurma-personal.apk > "$RUNNER_TEMP/apk-signature.txt"
          grep -qi "certificate SHA-256 digest: $expected" "$RUNNER_TEMP/apk-signature.txt"
          echo "APK signing certificate: $expected" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: personal-apk
          path: |
            dondurma-personal.apk
            dondurma-personal.apk.sha256
          if-no-files-found: error
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="personal-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dondurma-personal.apk dondurma-personal.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dondurma personal APK #${GITHUB_RUN_NUMBER}" \
            --notes "Personal Android build from ${GITHUB_SHA}. Download dondurma-personal.apk on your phone to install. Package: ${DONDURMA_APPLICATION_ID}."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/personal.jks"
